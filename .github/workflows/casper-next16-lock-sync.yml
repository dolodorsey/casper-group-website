name: Casper Next 16 Lock Sync

on:
  push:
    branches:
      - chatgpt/casper-wave2-creative-20260912

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/casper-wave2-creative-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade supported runtime dependencies
        run: npm install --save-exact next@16.3.5 react@19.1.1 react-dom@19.1.1 && npm install --save-dev --save-exact eslint@9.35.0 eslint-config-next@16.3.5 @types/react@19.1.12 @types/react-dom@19.1.9
      - name: Commit regenerated dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency graph already synchronized."
            exit 0
          fi
          git commit -m "Upgrade Casper to patched Next 16 runtime [lock-sync]"
          git push origin HEAD:chatgpt/casper-wave2-creative-20260912
