name: Casper Site Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: casper-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Build with TypeScript enforcement
        run: npm run build

      - name: Start production app
        run: |
          npm start -- -p 3100 > /tmp/casper-next.log 2>&1 &
          echo $! > /tmp/casper-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/casper-next.log
          exit 1

      - name: Verify every customer-facing route
        run: node scripts/verify-site-routes.mjs

      - name: Stop production app
        if: always()
        run: |
          if [ -f /tmp/casper-next.pid ]; then kill "$(cat /tmp/casper-next.pid)" || true; fi
